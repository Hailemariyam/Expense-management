# Local development database for the Expense Management backend.
#   docker compose up -d
#   cd backend && cp .env.example .env && npm install && npm run migrate:dev && npm run seed
#
# Host port 5433 is used to avoid colliding with any local Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: expense_mgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_mgmt
    ports:
      - "5433:5432"
    volumes:
      - expense_mgmt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expense_mgmt_pgdata:
